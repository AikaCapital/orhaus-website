    Object.assign(b, { name: d.name.trim(), address: d.address.trim(), area: d.area.trim(), transit: d.transit, promo: d.promo, pets: d.pets, parking: num(d.parking), storage: num(d.storage), rules: d.rules, notes: d.notes });
    if (d.partnerId) b.partnerId = d.partnerId;
    b.access = { door: d.door, code: d.code, loc: d.loc };
    log((ds.id ? t('Immeuble modifié : ', 'Building edited: ') : t('Immeuble ajouté : ', 'Building added: ')) + b.name);
    UI.modal = null; UI.sel = { building: b.id };
  },
  unit: (d, ds) => {
    if (num(d.minRent) > num(d.rent)) { toast(t('Le loyer minimum ne peut pas dépasser le loyer demandé.', 'Minimum rent cannot exceed the asking rent.')); return false; }
    let u = ds.id ? UN(ds.id) : null;
    if (!u) { u = { id: uid('n'), buildingId: ds.b, baths: 1, status: 'available' }; S.units.push(u); }
    Object.assign(u, { number: d.number.trim(), size: d.size, beds: { Studio: 0, '3½': 1, '4½': 2, '5½': 3 }[d.size], floor: num(d.floor), sqft: num(d.sqft), rent: num(d.rent), minRent: num(d.minRent), available: d.available });
    log((ds.id ? t('Unité modifiée : ', 'Unit edited: ') : t('Unité ajoutée : ', 'Unit added: ')) + unitLabel(u)); UI.modal = null;
  },
  import: d => {
    let nu = 0, nb = 0, bad = 0;
    (d.rows || '').split('\n').map(r => r.split(';').map(x => x.trim())).filter(r => r.length > 1 || r[0]).forEach(r => {
      if (r.length < 8 || !r[0] || !r[3] || !num(r[5])) { bad++; return; }
      let b = S.buildings.find(x => x.name.toLowerCase() === r[0].toLowerCase());
      if (!b) { b = { id: uid('b'), name: r[0], address: r[1], area: r[2], transit: '', promo: '', notes: '', inc: [], app: [], am: [], pets: '', parking: 0, storage: 0, access: { door: '', code: '', loc: '' }, rules: '', hue: Math.floor(Math.random() * 360), partnerId: (S.partners[0] || {}).id }; S.buildings.push(b); nb++; }
      if (S.units.some(u => u.buildingId === b.id && u.number === r[3])) { bad++; return; }
      S.units.push({ id: uid('n'), buildingId: b.id, number: r[3], size: r[4], beds: { Studio: 0, '3½': 1, '4½': 2, '5½': 3 }[r[4]] || 1, baths: 1, floor: 1, sqft: 0, rent: num(r[5]), minRent: num(r[6]) || num(r[5]), available: /^\d{4}-\d{2}-\d{2}$/.test(r[7]) ? r[7] : today(), status: 'available' }); nu++;
    });
    log(t('Import de tableur : ', 'Spreadsheet import: ') + nu + t(' unités, ', ' units, ') + nb + t(' immeubles créés', ' buildings created'));
    UI.modal = null; toast(nu + t(' unités importées, ', ' units imported, ') + nb + t(' immeubles créés', ' buildings created') + (bad ? ', ' + bad + t(' lignes ignorées', ' rows skipped') : '') + '.');
  },
  lease: (d, ds) => {
    const l = byId(S.leases, ds.id); Object.assign(l, { start: d.start, term: num(d.term), rent: num(d.rent) }); if (!l.filledBy) l.filledBy = 'manual';
    UI.modal = null;
    if (isBroker()) { signLease(l); log(t('Bail signé enregistré : ', 'Signed lease recorded: ') + cname(C(l.clientId))); toast(t('Bail enregistré. L’unité est louée et la commission est créée.', 'Lease recorded. The unit is rented and the commission is created.')); }
    else toast(t('Données du bail enregistrées. À approuver par un administrateur.', 'Lease data saved. To be approved by an admin.'));
  },
  partner: (d, ds) => {
    let p = ds.id ? P(ds.id) : null;
    if (!p) { p = { id: uid('p') }; S.partners.push(p); }
    Object.assign(p, { name: d.name.trim(), contact: d.contact, criteria: d.criteria, rate: num(d.rate) });
    log((ds.id ? t('Propriétaire modifié : ', 'Landlord edited: ') : t('Propriétaire ajouté : ', 'Landlord added: ')) + p.name); UI.modal = null;
  },
  slot: d => { if (!d.unitId || !d.agentId) return false; S.slots.push({ id: uid('s'), unitId: d.unitId, agentId: d.agentId, date: d.date, win: d.win, status: 'to_post', by: 'admin' }); UI.week = monday(d.date); toast(t('Créneau ajouté.', 'Slot added.')); },
  user: d => {
    const codes = S.users.map(u => Number((u.code || '').replace('DM-', '')) || 0), next = Math.max.apply(null, codes.concat([100])) + 1;
    S.users.push({ id: uid('u'), name: d.name.trim(), role: d.role, code: d.role === 'agent' ? 'DM-' + next : '', active: true });
    log(t('Utilisateur ajouté : ', 'User added: ') + d.name.trim()); toast(t('Utilisateur ajouté.', 'User added.'));
  },
  agency: d => { S.agency.name = d.name.trim() || S.agency.name; log(t('Nom de l’agence changé', 'Agency name changed')); },
  weights: d => {
    const w = { motivation: num(d.motivation), budget: num(d.budget), credit: num(d.credit), documents: num(d.documents) }, sum = w.motivation + w.budget + w.credit + w.documents;
    if (sum !== 100) { toast(t('Les quatre poids totalisent ', 'The four weights add up to ') + sum + t('. Ils doivent totaliser 100.', '. They must add up to 100.')); return false; }
    if (num(d.cond) >= num(d.qual)) { toast(t('Le seuil « conditionnel » doit être sous le seuil « qualifié ».', 'The “conditional” threshold must be below the “qualified” one.')); return false; }
    const st = set(); st.w = w; st.qual = num(d.qual); st.cond = num(d.cond);
    S.clients.forEach(c => { Object.keys(w).forEach(k => { c.score[k] = Math.min(c.score[k] || 0, w[k]); }); });
    log(t('Pointage des prospects modifié', 'Lead score changed')); toast(t('Pointage enregistré.', 'Score settings saved.'));
  },
  com: d => { set().com = { basis: d.basis, rate: num(d.rate), flat: num(d.flat) }; log(t('Règle de commission modifiée', 'Commission rule changed')); toast(t('Règle de commission enregistrée.', 'Commission rule saved.')); }
};

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (fn(el.dataset, el, e) !== false) render();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && UI.modal) { UI.modal = null; render(); return; }
  if (e.key === 'Enter' && e.target.matches && e.target.matches('tr[data-act]')) e.target.click();
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-chg]'); if (!el) return;
  const fn = CHG[el.dataset.chg]; if (!fn) return;
  if (fn(el.dataset, el.type === 'checkbox' ? el.checked : el.value, el) !== false) render();
});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-filter]'); if (!el) return;
  UI.f[el.dataset.filter] = el.value; render();
});
document.addEventListener('submit', e => {
  const form = e.target.closest('form[data-form]'); if (!form) return;
  e.preventDefault();
  const fn = FORM[form.dataset.form]; if (!fn) return;
  const data = Object.fromEntries(new FormData(form).entries());
  form.querySelectorAll('input[type=checkbox]').forEach(c => { if (c.name) data[c.name] = c.checked; });
  if (e.submitter && e.submitter.name) data[e.submitter.name] = e.submitter.value;
  if (fn(data, form.dataset, form) !== false) render();
});
window.addEventListener('hashchange', () => {
  const h = (location.hash || '').slice(1);
  if (!h || h === UI.view || !VIEWS[h]) return;
  go(h); render();
});

/* Pipeline board: drag a lead card onto another stage column. The button on each card does the same without a mouse. */
let dragLead = null;
document.addEventListener('dragstart', e => { const card = e.target.closest && e.target.closest('.pcard'); if (!card) return; dragLead = card.dataset.lead; card.classList.add('drag'); try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragLead); } catch (err) { /* older browsers */ } });
document.addEventListener('dragend', () => { dragLead = null; document.querySelectorAll('.pcard.drag, .pcol.over').forEach(el => el.classList.remove('drag', 'over')); });
document.addEventListener('dragover', e => { const col = dragLead && e.target.closest && e.target.closest('.pcol'); if (!col) return; e.preventDefault(); document.querySelectorAll('.pcol.over').forEach(el => { if (el !== col) el.classList.remove('over'); }); col.classList.add('over'); });
document.addEventListener('drop', e => {
  const col = dragLead && e.target.closest && e.target.closest('.pcol'); if (!col) return;
  e.preventDefault(); const c = C(dragLead); dragLead = null;
  const r = c && setStage(c, col.dataset.stage);
  render();
  if (r === 'locked') toast(lockedMsg()); else if (r) toast(cname(c) + t(' : ', ': ') + stageLabel(c.stage) + ' · ' + pct(prob(c)));
});

/* ---------- start ---------- */
function start(snap) {
  S = (snap && snap.v === 2 ? snap : null) || load() || seed();
  UI.week = monday(today());
  const h = (location.hash || '').slice(1);
  if (h && VIEWS[h]) UI.view = h;
  UI.keepScroll = false;
  render();
}
try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => S); } catch (e) { /* outside the viewer */ }
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
</script>
