/* Layout: a deep ink rail on the left, the working surface on a cool off-white. One theme by choice: deep neutrals with one muted accent, spruce green. */
:root{
  --bg:#F3F4F2; --surface:#FFFFFF; --raised:#FFFFFF; --bg-2:#E9ECE8; --ink:#12161A; --ink-2:#1D2227; --muted:#58616A; --line:#DADFD9;
  --accent:#2E5B50; --accent-2:#9CC2B4; --accent-deep:#1F4239; --accent-line:#C3D3CB; --accent-wash:#E3ECE7;
  --good:#2F6B4F; --warn:#7A5A1E; --bad:#8A3229; --info:#3F5568;
  --good-bg:#E1EDE5; --warn-bg:#F2EAD7; --bad-bg:#F4E3DF; --info-bg:#E4E9EE; --mute-bg:#ECEEEB;
  --shadow:0 1px 2px rgba(18,22,26,.04),0 8px 22px rgba(18,22,26,.05);
  --font-display:'Instrument Serif',Georgia,'Times New Roman',serif;
  --font-body:'Instrument Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;font-weight:400;line-height:1.08;font-variant-numeric:lining-nums}
h2{font-size:2.5rem;letter-spacing:-.01em}
h3{font-size:1.5rem}
h4{font-size:1.2rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ink);text-decoration-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums lining-nums}
.muted{color:var(--muted)}
.small{font-size:.84rem}

#app{height:100%;display:grid;grid-template-columns:248px minmax(0,1fr)}
.rail{background:var(--surface);color:var(--ink);display:flex;flex-direction:column;gap:20px;padding:26px 16px 20px;overflow-y:auto;border-right:1px solid var(--accent-line)}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 10px 16px;border-bottom:1px solid var(--accent-line)}
.brand b{font-family:var(--font-display);font-size:2.3rem;font-weight:400;letter-spacing:0;line-height:1}
.brand b i{font-style:normal;color:var(--accent)}
.brand span{font-size:.8rem;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;border-radius:6px;font-weight:500;color:var(--ink);border-left:2px solid transparent}
.nav button:hover{background:var(--bg-2)}
.nav button[aria-current="page"]{background:var(--accent-wash);border-left-color:var(--accent);font-weight:650}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav .count{background:var(--accent-2);color:var(--ink);font-size:.74rem;font-weight:700;border-radius:9px;padding:0 7px;min-width:20px;text-align:center}
.rail .who{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:14px 8px 0;border-top:1px solid var(--accent-line)}
.rail label{font-size:.78rem;color:var(--muted)}
.rail select{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 8px;color:var(--ink);width:100%}
.rail .railrow{display:flex;gap:6px}
.rail .mini{all:unset;cursor:pointer;font-size:.8rem;padding:5px 9px;border-radius:6px;border:1px solid var(--line);color:var(--ink)}
.rail .mini:hover{border-color:var(--accent)}
.rail .mini[aria-pressed="true"]{background:var(--accent-wash);border-color:var(--accent);font-weight:700}
.rail .mini:focus-visible{outline:2px solid var(--accent)}

.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow-y:auto}
.demo{background:var(--bg-2);color:var(--ink);padding:7px 40px;font-size:.84rem;font-weight:550;border-bottom:1px solid var(--accent-line)}
.page{padding:36px 40px 72px;display:flex;flex-direction:column;gap:26px;max-width:1260px;width:100%}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px}
.head h2::after{content:"";display:block;width:44px;height:2px;margin-top:12px;background:var(--accent)}
.head p{color:var(--muted);margin-top:10px;max-width:65ch}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:7px 14px;font-weight:600;font-size:.9rem;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#FFFFFF}
.btn.primary:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.btn.dark{background:var(--surface);border-color:var(--accent);color:var(--ink)}
.btn.dark:hover{background:var(--accent-wash)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{padding:4px 10px;font-size:.82rem;border-radius:6px}
.btn.link{border:none;background:none;padding:0;color:var(--ink);text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px;font-weight:600;box-shadow:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.tag{display:inline-flex;align-items:center;gap:.42em;padding:.16em .62em .16em .46em;border-radius:4px 11px 11px 4px;font-size:.78rem;font-weight:650;white-space:nowrap;background:var(--mute-bg);color:var(--muted)}
.tag::before{content:"";width:.52em;height:.52em;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 1.5px currentColor}
.tag.good{background:var(--good-bg);color:var(--good)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.info{background:var(--info-bg);color:var(--info)}
.tag.key{background:var(--accent-2);color:var(--ink)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.panel > .ptitle{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cols{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.cols.wide{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.spread.tight{flex-wrap:nowrap}
.spread.tight > :first-child{min-width:0}
.nw{white-space:nowrap}

.corridor{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--accent-line);border-radius:10px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.corridor button{all:unset;cursor:pointer;padding:18px 14px 14px;border-right:1px solid var(--accent-line);display:flex;flex-direction:column;gap:4px;min-width:0}
.corridor button:last-child{border-right:none;background:var(--ink);color:var(--bg)}
.corridor button:hover{background:var(--bg-2)}
.corridor button:last-child:hover{background:#1D2227}
.corridor button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.corridor b{font-family:var(--font-display);font-size:2.6rem;font-weight:400;line-height:.95;font-variant-numeric:lining-nums}
.corridor button:last-child b{color:var(--accent-2)}
.corridor span{font-size:.82rem;font-weight:600;overflow-wrap:anywhere}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{font-weight:650;text-align:left;font-size:.8rem;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--accent-line);vertical-align:bottom}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--bg-2)}
td.r,th.r{text-align:right}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field > span{font-size:.8rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=tel],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=checkbox]{accent-color:var(--ink)}
textarea{min-height:74px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.check{display:flex;gap:8px;align-items:flex-start}
.check input{margin-top:3px}

.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 20px}
.kv div{display:flex;flex-direction:column;gap:1px;min-width:0}
.kv dt,.kv .k{font-size:.78rem;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:6px;padding:2px 9px;font-size:.82rem;background:var(--bg)}

.facade{width:64px;height:64px;border-radius:6px;flex:none;background-color:#1D2227;background-image:linear-gradient(#1D2227 3px,transparent 3px),linear-gradient(90deg,#1D2227 3px,transparent 3px),linear-gradient(var(--accent-line),var(--accent-line));background-size:12px 13px,12px 13px,100% 100%;border:3px solid #1D2227}
.facade.lg{width:104px;height:104px;background-size:15px 17px,15px 17px,100% 100%}
.bcard{display:flex;gap:16px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer;text-align:left;width:100%;box-shadow:var(--shadow)}
.bcard:hover{border-color:var(--accent)}
.blist{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}

.slot{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;padding:18px 20px;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:var(--shadow)}
.daybox{width:64px;text-align:center;border:1px solid var(--accent-line);border-radius:8px;padding:7px 4px;background:var(--surface);align-self:start}
.daybox b{display:block;font-family:var(--font-display);font-size:2rem;line-height:1;font-weight:400;font-variant-numeric:lining-nums}
.daybox small{font-size:.74rem;color:var(--muted);font-weight:600}
.listing{background:var(--bg);border:1px dashed var(--accent-line);border-radius:8px;padding:11px 13px;font-size:.88rem;white-space:pre-wrap}
.meter{height:6px;border-radius:4px;background:var(--mute-bg);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}

.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:12px;overflow-x:auto;padding-bottom:4px}
.kcol{background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kcard{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.kcard:hover{border-color:var(--accent)}
.kcard:focus-visible{outline:2px solid var(--accent)}

.steps{display:flex;flex-wrap:wrap;gap:6px}
.steps span{font-size:.8rem;font-weight:600;padding:4px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.steps span.done{background:var(--good-bg);color:var(--good);border-color:transparent}
.steps span.now{background:var(--ink);color:var(--bg);border-color:var(--accent)}
.steps span.stop{background:var(--bad-bg);color:var(--bad);border-color:transparent}

.note{border-left:2px solid var(--accent);background:var(--bg-2);padding:9px 14px;border-radius:0 8px 8px 0;font-size:.86rem}
.note.warn{border-left-color:var(--warn);background:var(--warn-bg)}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--accent-line);border-radius:10px}
.log{display:flex;flex-direction:column;gap:8px}
.log li{list-style:none;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:.88rem}
ul.log{margin:0;padding:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 13px;font-size:.86rem;font-weight:600;background:var(--surface);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent-wash);box-shadow:inset 0 -2px 0 var(--accent)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.big{font-family:var(--font-display);font-size:2.6rem;font-weight:400;line-height:1;font-variant-numeric:lining-nums}

.overlay{position:fixed;inset:0;background:rgba(18,22,26,.42);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto;z-index:20}
.modal{background:var(--surface);border-radius:12px;border:1px solid var(--accent-line);width:min(680px,100%);padding:24px 26px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 50px rgba(18,22,26,.18)}
.modal.renter{border-top:3px solid var(--accent)}
.mfoot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;border-top:2px solid var(--accent-2);font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw}
#toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}

@media (max-width: 860px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .rail{flex-direction:row;align-items:center;gap:10px;padding:10px 12px;overflow-x:auto;border-right:none;border-bottom:1px solid var(--accent-line)}
  .brand{flex-direction:row;align-items:baseline;gap:8px;white-space:nowrap;padding:0 8px;border-bottom:none}
  .brand b{font-size:1.7rem}
  .nav{flex-direction:row}
  .nav button{white-space:nowrap;border-left:none;border-bottom:2px solid transparent}
  .nav button[aria-current="page"]{border-bottom-color:var(--accent)}
  .rail .who{margin:0;border:none;padding:0;flex-direction:row;align-items:center}
  .rail .who label{display:none}
  .rail select{width:auto}
  .demo{padding:7px 16px}
  .page{padding:22px 16px 48px}
  h2{font-size:1.9rem}
  .cols.wide{grid-template-columns:minmax(0,1fr)}
  .corridor{grid-template-columns:repeat(2,minmax(0,1fr))}
  .corridor button{border-bottom:1px solid var(--accent-line)}
  .corridor button:last-child{grid-column:1/-1;border-bottom:none}
}

/* The rail is the one deep surface of the app: ink, with the light accent for the current section. */
.rail{background:var(--ink);color:#E8ECE9;border-right:none}
.brand{border-bottom:1px solid rgba(255,255,255,.14)}
.brand b{color:#FFFFFF}
.brand b i{color:var(--accent-2)}
.brand span{color:rgba(255,255,255,.62)}
.nav button{color:#E8ECE9}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button[aria-current="page"]{background:rgba(255,255,255,.11);border-left-color:var(--accent-2);color:#FFFFFF}
.nav button:focus-visible,.rail .mini:focus-visible{outline:2px solid var(--accent-2)}
.nav .count{background:var(--accent-2);color:var(--ink)}
.rail .who{border-top:1px solid rgba(255,255,255,.14)}
.rail label{color:rgba(255,255,255,.62)}
.rail select{background:var(--ink-2);border-color:rgba(255,255,255,.22);color:#FFFFFF}
.rail .mini{border-color:rgba(255,255,255,.22);color:#E8ECE9}
.rail .mini:hover{border-color:var(--accent-2)}
.rail .mini[aria-pressed="true"]{background:var(--accent-2);border-color:var(--accent-2);color:var(--ink)}
.demo a{color:var(--ink)}

/* Lead pipeline and assigned leads */
.pipe-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow);min-width:0}
.stat b{font-family:var(--font-display);font-size:2.6rem;line-height:1;font-weight:400}
.stat > span:first-of-type{font-size:.86rem;font-weight:600}
.pipeline{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(160px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;align-items:start}
.pcol{background:var(--bg-2);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-width:0}
.pcol.over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-wash)}
.phead{padding:12px 12px 11px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.pname{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;min-height:2.5em;line-height:1.25}
.pname b{min-width:0;overflow-wrap:anywhere}
.phead .prob{font-family:var(--font-display);font-size:2.1rem;line-height:1}
.pbar{height:4px;border-radius:2px;background:var(--surface);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}
.pbody{padding:10px;display:flex;flex-direction:column;gap:8px;min-height:64px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;display:flex;flex-direction:column;gap:5px;cursor:grab;min-width:0}
.pcard:hover{border-color:var(--accent)}
.pcard.drag{opacity:.45}
.pcard .btn.link{text-align:left;font-size:.95rem}
.pchip{font-size:.8rem;font-weight:650;color:var(--accent-deep);background:var(--accent-wash);border-radius:5px;padding:1px 7px}
.lostbox summary{cursor:pointer}
.lostbox[open] summary{margin-bottom:4px}
@media (max-width: 860px){
  .rail{border-bottom:none}
  .nav button[aria-current="page"]{border-bottom-color:var(--accent-2)}
}
</style>

<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* Orhaus prototype. All data is fictional sample data. State lives in the page; localStorage is a per-viewer convenience only. */
const KEY = 'orhaus-demo-v3';
let S = null;
const UI = { view: 'accueil', sel: {}, modal: null, f: {}, week: null, cview: 'table' };

/* ---------- small helpers ---------- */
const t = (fr, en) => (S && S.lang === 'en') ? en : fr;
const L = x => (x && typeof x === 'object') ? (x[S.lang] || x.fr || '') : (x || '');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => p + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => iso(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const monday = s => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return iso(d); };
const loc = () => S.lang === 'en' ? 'en-CA' : 'fr-CA';
const fdate = (s, o) => s ? new Date(s + 'T12:00:00').toLocaleDateString(loc(), o || { weekday: 'short', day: 'numeric', month: 'short' }) : '';
const fmonth = s => s ? new Date(s + 'T12:00:00').toLocaleDateString(loc(), { month: 'long', year: 'numeric' }) : '';
const money = n => new Intl.NumberFormat(loc(), { style: 'currency', currency: 'CAD', maximumFractionDigits: 0 }).format(n || 0);
const now = () => { const d = new Date(); return iso(d) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const tag = (kind, label) => '<span class="tag ' + kind + '">' + esc(label) + '</span>';
const opt = (v, label, cur) => '<option value="' + esc(v) + '"' + (String(v) === String(cur) ? ' selected' : '') + '>' + esc(label) + '</option>';

/* ---------- lookups ---------- */
const byId = (arr, id) => arr.find(x => x.id === id);
const U = id => byId(S.users, id) || { name: '—', code: '' };
const B = id => byId(S.buildings, id);
const UN = id => byId(S.units, id);
const C = id => byId(S.clients, id);
const P = id => byId(S.partners, id);
const A = id => byId(S.apps, id);
const me = () => U(S.me);
const isAdmin = () => me().role === 'admin';
const isBroker = () => S.agency.mode === 'broker';
const set = () => S.agency.set;
const cname = c => c ? c.first + ' ' + c.last : '—';
const unitLabel = u => { const b = B(u.buildingId); return (b ? b.name : '') + ' · ' + t('unité ', 'unit ') + u.number; };
const agents = () => S.users.filter(u => u.role === 'agent' && u.active);
const mine = arr => isAdmin() ? arr : arr.filter(x => x.agentId === S.me);

/* ---------- dictionaries ---------- */
const FEAT = {
  heat: ['Chauffage', 'Heating'], hotwater: ['Eau chaude', 'Hot water'], power: ['Électricité', 'Electricity'], ac: ['Climatisation', 'Air conditioning'],
  fridge: ['Réfrigérateur', 'Fridge'], stove: ['Cuisinière', 'Stove'], dishwasher: ['Lave-vaisselle', 'Dishwasher'], washer: ['Laveuse-sécheuse', 'Washer-dryer'],
  elevator: ['Ascenseur', 'Elevator'], gym: ['Salle d’entraînement', 'Gym'], terrace: ['Terrasse sur le toit', 'Roof terrace'], pool: ['Piscine', 'Pool'], bike: ['Rangement à vélos', 'Bike storage']
};
const feat = k => FEAT[k] ? t(FEAT[k][0], FEAT[k][1]) : k;
/* Lead pipeline: six stages, each with a closing probability that grows stage by stage. "lost" sits outside the pipeline, at 0 %. */
const STAGES = ['cold', 'contacted', 'booked', 'showed', 'application', 'signed'];
const PROB = { cold: 8, contacted: 20, booked: 40, showed: 60, application: 80, signed: 100, lost: 0 };
const ALL_STAGES = STAGES.concat(['lost']);
const stageLabel = s => ({
  cold: t('Prospect froid', 'Cold lead'), contacted: t('Contacté', 'Contacted'), booked: t('Rendez-vous fixé', 'Appointment booked'), showed: t('Unité visitée', 'Unit shown'),
  application: t('Demande commencée', 'Application started'), signed: t('Bail signé', 'Lease signed'), lost: t('Perdu', 'Lost')
}[s] || s);
const stageKind = s => ({ cold: '', contacted: 'info', booked: 'info', showed: 'warn', application: 'warn', signed: 'key', lost: 'bad' }[s] || '');
const prob = c => PROB[c.stage] || 0;
const pct = n => n + (S.lang === 'en' ? '%' : '\u00a0%');
const stageTag = c => tag(stageKind(c.stage), stageLabel(c.stage) + ' · ' + pct(prob(c)));
const slotLabel = s => ({ proposed: t('Proposée', 'Proposed'), to_post: t('À publier', 'To post'), posted: t('Publiée', 'Posted'), paused: t('En pause', 'Paused') }[s]);
const slotKind = s => ({ proposed: 'info', to_post: 'warn', posted: 'good', paused: '' }[s]);
const showLabel = s => ({
  booked: t('En attente de confirmation', 'Awaiting confirmation'), confirmed: t('Confirmée', 'Confirmed'), declined: t('Refusée par le prospect', 'Declined by prospect'),
  showed: t('Visite faite', 'Showed up'), no_show: t('Absent', 'No show'), cancelled: t('Annulée', 'Cancelled')
}[s]);
const showKind = s => ({ booked: 'warn', confirmed: 'good', declined: 'bad', showed: 'key', no_show: 'bad', cancelled: '' }[s]);
const APP_STEPS = () => ['client', 'agent_review', 'admin_review'].concat(isBroker() ? ['partner'] : []).concat(['approved']);
const appLabel = s => ({
  client: t('Chez le candidat', 'With the applicant'), agent_review: t('Vérification de l’agent', 'Agent check'), admin_review: t('Vérification de l’administrateur', 'Admin check'),
  partner: t('Chez le propriétaire', 'With the landlord'), approved: t('Approuvée', 'Approved'), refused: t('Refusée', 'Refused'), withdrawn: t('Retirée', 'Withdrawn')
}[s] || s);
const appKind = s => ({ client: 'info', agent_review: 'warn', admin_review: 'warn', partner: 'info', approved: 'good', refused: 'bad', withdrawn: '' }[s] || '');
const docLabel = k => ({
  id_seen: t('Pièce d’identité vue par l’agent (aucune copie conservée)', 'ID seen by the agent (no copy kept)'),
  landlord_ref: t('Coordonnées du locateur précédent', 'Previous landlord’s contact'),
  credit_consent: t('Consentement à l’enquête de crédit', 'Consent to a credit check'),
  income_optional: t('Preuve de revenu (facultative, fournie volontairement)', 'Proof of income (optional, provided voluntarily)')
}[k] || k);
const docStatus = s => ({ missing: [t('Manquant', 'Missing'), 'bad'], received: [t('Reçu', 'Received'), 'warn'], verified: [t('Vérifié', 'Verified'), 'good'], flagged: [t('Signalé', 'Flagged'), 'bad'] }[s]);
const leaseLabel = l => ({
  draft: isBroker() ? t('En attente du bail du propriétaire', 'Waiting for the landlord’s lease') : t('Ébauche à approuver', 'Draft to approve'),
  approved: t('Approuvé, à envoyer', 'Approved, to send'), sent: t('Envoyé à la signature', 'Sent for signature'), signed: t('Signé', 'Signed')
}[l.status]);
const leaseKind = s => ({ draft: 'warn', approved: 'info', sent: 'info', signed: 'key' }[s]);
const comLabel = s => ({ pending: t('À approuver', 'To approve'), approved: t('Approuvée', 'Approved'), paid: t('Payée', 'Paid') }[s]);
const comKind = s => ({ pending: 'warn', approved: 'info', paid: 'good' }[s]);
const reviewLabel = s => ({ invited: t('Invité', 'Invited'), received: t('Reçu', 'Received') }[s]);
const reviewKind = s => ({ invited: 'warn', received: 'good' }[s]);
const BANDS = ['A', 'B', 'C', 'D'];

/* ---------- domain logic ---------- */
function log(action) { S.audit.unshift({ at: now(), by: me().name, action }); if (S.audit.length > 200) S.audit.pop(); }
function act(clientId, type, note) { S.activities.unshift({ id: uid('ac'), clientId, type, note, by: me().name, at: now() }); const c = C(clientId); if (c) c.lastContact = today(); }
function score(c) { const s = c.score || {}; return (s.motivation || 0) + (s.budget || 0) + (s.credit || 0) + (s.documents || 0); }
function scoreTag(c) { const n = score(c), st = set(); return n >= st.qual ? tag('good', n + ' · ' + t('qualifié', 'qualified')) : n >= st.cond ? tag('warn', n + ' · ' + t('conditionnel', 'conditional')) : tag('bad', n + ' · ' + t('arrêt', 'stop')); }
function advance(c, stage) { if (!c) return; const i = STAGES.indexOf(c.stage), j = STAGES.indexOf(stage); if (c.stage === 'lost' || j > i) c.stage = stage; }
/* A stage set by hand (board, card button or the client page) leaves a line in the lead's activity, with the new probability.
   "Application started" and "Lease signed" are never set by hand: they come from starting an application and from the signed lease. */
const HAND_STAGES = ['cold', 'contacted', 'booked', 'showed', 'lost'];
const lockedMsg = () => t('Cette étape vient de la demande ou du bail, pas d’un déplacement à la main.', 'This stage comes from the application or the lease, not from a move by hand.');
function setStage(c, stage) {
  if (!c || c.stage === stage || ALL_STAGES.indexOf(stage) < 0) return false;
  if (c.stage === 'signed' || HAND_STAGES.indexOf(stage) < 0) return 'locked';
  c.stage = stage;
  S.activities.unshift({ id: uid('ac'), clientId: c.id, type: 'stage', note: { fr: 'Étape : ' + ({ cold: 'Prospect froid', contacted: 'Contacté', booked: 'Rendez-vous fixé', showed: 'Unité visitée', application: 'Demande commencée', signed: 'Bail signé', lost: 'Perdu' }[stage]) + ' · ' + PROB[stage] + '\u00a0%', en: 'Stage: ' + ({ cold: 'Cold lead', contacted: 'Contacted', booked: 'Appointment booked', showed: 'Unit shown', application: 'Application started', signed: 'Lease signed', lost: 'Lost' }[stage]) + ' · ' + PROB[stage] + '%' }, by: me().name, at: now() });
  return true;
}
/* Assigned leads: the office (an administrator) hands a lead to an agent, moves it to another agent or takes it back. */
const assignedByOffice = c => !!(c && c.agentId && c.assignedBy);
const openShow = h => (h.status === 'booked' || h.status === 'confirmed') && h.date >= today();
const openApp = a => !['approved', 'refused', 'withdrawn'].includes(a.stage);
const openWork = c => S.showings.some(h => h.clientId === c.id && openShow(h)) || S.apps.some(a => a.clientId === c.id && openApp(a));
function assignLead(c, agentId) {
  if (!c || !isAdmin()) return 'denied';
  const from = c.agentId || '', to = agentId || '';
  if (from === to) return 'same';
  if (!to && openWork(c)) return 'open';
  const who = me().name, a = to ? U(to).name : '';
  c.agentId = to || null; c.assignedBy = to ? S.me : null; c.assignedAt = to ? now() : null;
  if (to) {
    S.showings.forEach(h => { if (h.clientId === c.id && openShow(h)) h.agentId = to; });
    S.apps.forEach(x => { if (x.clientId === c.id && openApp(x)) x.agentId = to; });
  }
  const kind = !to ? 'unassigned' : from ? 'reassigned' : 'assigned';
  const note = { unassigned: { fr: 'Attribution retirée par ' + who, en: 'Unassigned by ' + who }, reassigned: { fr: 'Réattribué à ' + a + ' par ' + who, en: 'Reassigned to ' + a + ' by ' + who }, assigned: { fr: 'Attribué à ' + a + ' par ' + who, en: 'Assigned to ' + a + ' by ' + who } }[kind];
  S.activities.unshift({ id: uid('ac'), clientId: c.id, type: 'assign', note, by: who, at: now() });
  log({ fr: { unassigned: 'Attribution retirée : ', reassigned: 'Prospect réattribué : ', assigned: 'Prospect attribué : ' }[kind] + cname(c) + (to ? ' · ' + a : ''), en: { unassigned: 'Lead unassigned: ', reassigned: 'Lead reassigned: ', assigned: 'Lead assigned: ' }[kind] + cname(c) + (to ? ' · ' + a : '') });
  return kind;
}
function matches(c) {
  const b = c.brief || {};
  return S.units.filter(u => u.status === 'available').map(u => {
    const bd = B(u.buildingId); let pts = 0;
    if (b.budgetMax && u.rent <= b.budgetMax) pts += 50; else if (b.budgetMax && u.rent <= b.budgetMax * 1.07) pts += 25;
    if (b.size && u.size === b.size) pts += 30;
    if (b.area && bd && bd.area === b.area) pts += 20; else if (!b.area) pts += 10;
    return { u, pts };
  }).filter(m => m.pts >= 50).sort((x, y) => y.pts - x.pts || x.u.rent - y.u.rent).slice(0, 6);
}
function listingText(u) {
  const b = B(u.buildingId), a = U(S.me);
  const inc = (b.inc || []).map(feat).join(', ');
  const lines = [
    u.size + ' ' + t('à louer', 'for rent') + ' · ' + b.area + ' · ' + money(u.rent) + t(' par mois', ' per month'),
    b.name + ', ' + b.address,

  let body;
  if (adm) {
    const q = queues();

        <td class="num">${S.apps.filter(x => x.agentId === a.id && !['refused', 'withdrawn'].includes(x.stage)).length}</td>
        <td class="num">${S.leases.filter(l => l.agentId === a.id && l.status === 'signed').length}</td></tr>`;
    }).join('');
    const qi = (n, label, view) => `<div class="spread tight"><span>${n ? tag('warn', String(n)) : tag('good', '0')} ${esc(label)}</span>${btn('go', t('Ouvrir', 'Open'), 'sm', `data-view="${view}"`)}</div>`;
    body = `<div class="cols wide">
      <div class="panel"><div class="ptitle"><h3>${t('Équipe', 'Team')}</h3><span class="small muted">${t('Depuis le début de la démo', 'Since the start of the demo')}</span></div>
        <div class="tw"><table><thead><tr><th>${t('Agent', 'Agent')}</th><th>${t('Annonces publiées', 'Listings posted')}</th><th>${t('Prospects actifs', 'Active leads')}</th><th>${t('Visites faites', 'Showings done')}</th><th>${t('Demandes', 'Applications')}</th><th>${t('Baux signés', 'Leases signed')}</th></tr></thead><tbody>${rows}</tbody></table></div></div>
      <div class="panel"><h3>${t('Files d’attente', 'Queues')}</h3>
        ${qi(q.proposed, t('créneaux proposés à approuver', 'proposed slots to approve'), 'horaire')}
        ${qi(q.unassigned, t('prospects à attribuer', 'leads to assign'), 'attribution')}
        ${qi(S.apps.filter(a => a.stage === 'admin_review').length, t('demandes à vérifier', 'applications to verify'), 'demandes')}
        ${isBroker() ? qi(S.apps.filter(a => a.stage === 'partner').length, t('réponses de propriétaires attendues', 'landlord answers awaited'), 'demandes') : ''}
        ${qi(q.leases, t('baux à finaliser', 'leases to finalise'), 'baux')}
        ${qi(S.coms.filter(k => k.status === 'pending').length, t('commissions à approuver', 'commissions to approve'), 'commissions')}

/* ---------- agent: my listings ---------- */
VIEWS.annonces = () => {
  const range = UI.f.range || 'week', d = today(), wk = monday(d), end = addDays(wk, 6);
  let list = S.slots.filter(s => s.agentId === S.me && (s.status === 'to_post' || s.status === 'posted'));
  const all = list.filter(s => s.date >= wk && s.date <= end);
  if (range === 'today') list = list.filter(s => s.date === d || (s.date < d && s.status === 'to_post'));
  else if (range === 'week') list = list.filter(s => (s.date >= wk && s.date <= end) || s.status === 'to_post');
  list.sort((a, b) => a.date < b.date ? -1 : 1);
  const posted = all.filter(s => s.status === 'posted').length;
  const seg = `<div class="seg" role="group">${[['today', t('Aujourd’hui', 'Today')], ['week', t('Cette semaine', 'This week')], ['all', t('Tout', 'All')]].map(o => `<button type="button" data-act="filter" data-k="range" data-v="${o[0]}" aria-pressed="${range === o[0]}">${o[1]}</button>`).join('')}</div>`;
  const cards = list.map(s => {
    const u = UN(s.unitId), b = B(u.buildingId), dt = new Date(s.date + 'T12:00:00');
    return `<div class="slot"><div class="daybox"><small>${esc(dt.toLocaleDateString(loc(), { weekday: 'short' }))}</small><b class="num">${dt.getDate()}</b><small>${esc(dt.toLocaleDateString(loc(), { month: 'short' }))}</small></div>
      <div class="stack"><div class="spread"><div><h3>${esc(b.name)} · ${esc(u.size)} · ${money(u.rent)}</h3><div class="small muted">${esc(b.address)} · ${t('unité ', 'unit ')}${esc(u.number)} · ${t('créneau ', 'window ')}${esc(s.win)}</div></div>${s.status === 'to_post' && s.date < d ? tag('bad', t('En retard', 'Overdue')) : tag(slotKind(s.status), slotLabel(s.status))}</div>
      <div class="listing" id="lt-${s.id}">${esc(listingText(u))}</div>
      <div class="row">${btn('copy', t('Copier la description', 'Copy the description'), '', `data-id="${s.id}"`)}${btn('openBuilding', t('Voir l’immeuble', 'View the building'), '', `data-id="${b.id}"`)}${s.status === 'to_post' ? btn('post', t('Marquer comme publiée', 'Mark as posted'), 'primary', `data-id="${s.id}"`) : btn('unpost', t('Annuler la publication', 'Undo posted'), '', `data-id="${s.id}"`)}</div></div></div>`;
  }).join('');
  return head(t('Mes annonces', 'My listings'), t('Chaque créneau vous est attribué par l’agence. Publiez l’annonce, puis marquez-la comme publiée.', 'Each slot is assigned to you by the agency. Post the listing, then mark it as posted.'), seg)
    + `<div class="panel"><div class="spread"><b>${posted} ${t('sur', 'of')} ${all.length} ${t('publiées cette semaine', 'posted this week')}</b><span class="small muted">${t('Votre code d’annonce : ', 'Your listing code: ')}<b>${esc(me().code)}</b></span></div><div class="meter"><i style="width:${all.length ? Math.round(posted / all.length * 100) : 0}%"></i></div></div>`
    + (cards || empty(t('Aucun créneau pour cette période.', 'No slots for this period.')))
    + `<p class="note">${t('La publication sur les sites d’annonces reste manuelle : ces sites n’acceptent pas les annonces poussées par un logiciel tiers.', 'Posting on listing sites stays manual: those sites do not accept listings pushed by outside software.')}</p>`;
};

/* ---------- properties / inventory ---------- */
VIEWS.immeubles = () => {
  const adm = isAdmin();
  const b = UI.sel.building && B(UI.sel.building);
  if (b) return buildingPage(b, adm);
  const q = (UI.f.qb || '').toLowerCase(), size = UI.f.bsize || '', max = Number(UI.f.bmax) || 0;
  const cards = S.buildings.filter(x => !q || (x.name + ' ' + x.address + ' ' + x.area).toLowerCase().includes(q)).map(x => {
    let us = S.units.filter(u => u.buildingId === x.id && u.status === 'available');
    if (size) us = us.filter(u => u.size === size);
    if (max) us = us.filter(u => u.rent <= max);
    if ((size || max) && !us.length) return '';

    return `<button type="button" class="bcard" data-act="openBuilding" data-id="${x.id}"><span class="facade" style="--h:${x.hue}"></span><span class="stack" style="gap:4px"><b style="font-family:var(--font-display);font-weight:600;font-size:1.45rem;line-height:1.1">${esc(x.name)}</b><span class="small muted">${esc(x.area)} · ${esc(x.address)}</span><span class="row">${tag(us.length ? 'good' : '', us.length + ' ' + t('disponibles', 'available'))}${from ? `<span class="num small"><b>${t('dès ', 'from ')}${money(from)}</b></span>` : ''}${L(x.promo) ? tag('key', t('Promotion', 'Promo')) : ''}</span></span></button>`;

function buildingPage(b, adm) {

/* ---------- clients ---------- */
VIEWS.clients = () => {
  const c = UI.sel.client && C(UI.sel.client);
  if (c && (isAdmin() || c.agentId === S.me)) return clientPage(c);
  const adm = isAdmin(), q = (UI.f.qc || '').toLowerCase(), st = UI.f.cstage || '', ag = UI.f.cagent || '';
  let list = mine(S.clients).filter(x => (!q || (cname(x) + ' ' + x.phone + ' ' + x.email).toLowerCase().includes(q)) && (!st || x.stage === st) && (!ag || x.agentId === ag));
  list.sort((a, b) => score(b) - score(a));

  const filters = `<div class="fgrid">${fld(t('Recherche', 'Search'), `<input id="q-c" type="text" data-filter="qc" value="${esc(UI.f.qc || '')}" placeholder="${t('Nom, téléphone, courriel', 'Name, phone, email')}">`)}${fld(t('Étape', 'Stage'), `<select id="q-cstage" data-chg="filter" data-k="cstage">${opt('', t('Toutes les étapes', 'All stages'), st)}${ALL_STAGES.map(s => opt(s, stageLabel(s), st)).join('')}</select>`)}${adm ? fld(t('Agent', 'Agent'), `<select id="q-cagent" data-chg="filter" data-k="cagent">${opt('', t('Tous les agents', 'All agents'), ag)}${agents().map(a => opt(a.id, a.name, ag)).join('')}</select>`) : ''}</div>`;

  return head(t('Clients', 'Clients'), `${list.length} ${t('dossiers', 'files')}. ${t('Le pointage sur 100 guide la priorité : motivation, budget, crédit, documents.', 'The score out of 100 sets priority: motivation, budget, credit, documents.')}`, btn('go', t('Voir le pipeline', 'View the pipeline'), '', 'data-view="pipeline"') + btn('modal', t('Nouveau prospect', 'New lead'), 'primary', 'data-m="lead"')) + filters + body;
};

    <div class="cols wide"><div class="stack">
      <form class="panel" data-form="brief" data-id="${c.id}"><div class="ptitle"><h3>${t('Ce que le client cherche', 'What the client wants')}</h3><button class="btn sm" type="submit">${t('Enregistrer', 'Save')}</button></div>

        ${fld(t('Notes', 'Notes'), `<textarea id="f-brief-notes" name="notes">${esc(br.notes || '')}</textarea>`)}</form>
      <div class="panel"><div class="ptitle"><h3>${t('Unités qui correspondent', 'Matching units')}</h3><span class="small muted">${ms.length} ${t('trouvées', 'found')}</span></div>
        ${ms.length ? `<div class="tw"><table><tbody>${ms.map(m => `<tr><td><b>${esc(unitLabel(m.u))}</b><div class="small muted">${esc(B(m.u.buildingId).area)} · ${esc(m.u.size)}</div></td><td class="num r"><b>${money(m.u.rent)}</b></td><td>${esc(fmonth(m.u.available))}</td><td>${tag(m.pts >= 90 ? 'good' : 'info', m.pts + ' %')}</td><td class="r">${btn('modal', t('Réserver une visite', 'Book a visit'), 'sm', `data-m="visit" data-client="${c.id}" data-unit="${m.u.id}"`)}</td></tr>`).join('')}</tbody></table></div>` : empty(t('Aucune unité disponible ne correspond. Élargissez le budget ou le quartier.', 'No available unit matches. Widen the budget or the area.'))}</div>
      <div class="panel"><h3>${t('Activité', 'Activity')}</h3>
        <div class="row">${quick.map(qk => btn('quick', qk[0], 'sm', `data-id="${c.id}" data-note="${esc(qk[0])}" data-reached="${qk[1]}"`)).join('')}</div>
        <form class="row" data-form="note" data-id="${c.id}"><input id="f-note-text" name="text" type="text" placeholder="${t('Ajouter une note', 'Add a note')}" style="flex:1;min-width:180px" aria-label="${t('Note', 'Note')}"><button class="btn" type="submit">${t('Ajouter', 'Add')}</button></form>

        ${adm ? fld(t('Agent responsable', 'Assigned agent'), `<select id="cl-agent" data-chg="clientAgent" data-id="${c.id}">${opt('', t('Non attribué', 'Unassigned'), c.agentId || '')}${agents().map(a => opt(a.id, a.name, c.agentId)).join('')}</select>`) : `<div class="small muted">${t('Agent : ', 'Agent: ')}${esc(U(c.agentId).name)}</div>`}

        ${fld(t('Étape du pipeline', 'Pipeline stage'), `<select id="cl-stage" data-chg="clientStage" data-id="${c.id}">${ALL_STAGES.map(x => `<option value="${x}"${x === c.stage ? ' selected' : ''}${x !== c.stage && (c.stage === 'signed' || HAND_STAGES.indexOf(x) < 0) ? ' disabled' : ''}>${esc(stageLabel(x) + ' · ' + pct(PROB[x]))}</option>`).join('')}</select>`)}

/* ---------- showings ---------- */
VIEWS.visites = () => {
  const adm = isAdmin(), st = UI.f.hstatus || '';
  const list = mine(S.showings).filter(h => !st || h.status === st).sort((a, b) => (a.date + a.time > b.date + b.time ? -1 : 1));
  const rows = list.map(h => {
    const c = C(h.clientId), u = UN(h.unitId), hasApp = S.apps.some(a => a.clientId === h.clientId && a.unitId === h.unitId);
    let acts = '';
    if (h.status === 'booked') acts = btn('modal', t('Voir le courriel du prospect', 'View the prospect’s email'), 'sm primary', `data-m="mail" data-id="${h.id}"`) + btn('showing', t('Annuler', 'Cancel'), 'sm', `data-id="${h.id}" data-s="cancelled"`);
    else if (h.status === 'confirmed') acts = btn('showing', t('Visite faite', 'Showed up'), 'sm primary', `data-id="${h.id}" data-s="showed"`) + btn('showing', t('Absent', 'No show'), 'sm', `data-id="${h.id}" data-s="no_show"`) + btn('showing', t('Annuler', 'Cancel'), 'sm', `data-id="${h.id}" data-s="cancelled"`);
    else if (h.status === 'showed' && !hasApp) acts = btn('modal', t('Démarrer une demande', 'Start an application'), 'sm primary', `data-m="apply" data-client="${h.clientId}" data-unit="${h.unitId}"`);
    else if (h.status === 'declined' || h.status === 'no_show') acts = btn('modal', t('Proposer un autre moment', 'Offer another time'), 'sm', `data-m="visit" data-client="${h.clientId}" data-unit="${h.unitId}"`);

};
/* ---------- applications ---------- */

const ruleTag = a => !a.rule ? tag('', t('Pas encore évaluée', 'Not screened yet')) : a.rule.pass ? tag('good', t('Dossier clair', 'Clear pass')) : tag('warn', t('À examiner', 'Needs review'));

VIEWS.demandes = () => {
  const a = UI.sel.app && A(UI.sel.app);

  const rows = list.map(x => `<tr class="click" tabindex="0" data-act="openApp" data-id="${x.id}"><td><b>${esc(cname(C(x.clientId)))}</b></td><td>${esc(unitLabel(UN(x.unitId)))}</td>${adm ? `<td>${esc(U(x.agentId).name)}</td>` : ''}<td>${tag(appKind(x.stage), appLabel(x.stage))}</td><td class="num">${docsDone(x)}</td><td>${ruleTag(x)}</td><td>${esc(fdate(x.createdAt))}</td></tr>`).join('');

};

function appPage(a) {
  const c = C(a.clientId), u = UN(a.unitId), b = B(u.buildingId), adm = isAdmin(), p = isBroker() ? P(b.partnerId) : null;
  const steps = APP_STEPS(), idx = steps.indexOf(a.stage), dead = a.stage === 'refused' || a.stage === 'withdrawn';
  const stepper = `<div class="steps">${steps.map((s, i) => `<span class="${dead ? '' : i < idx ? 'done' : i === idx ? 'now' : ''}">${i + 1}. ${esc(appLabel(s))}</span>`).join('')}${dead ? `<span class="stop">${esc(appLabel(a.stage))}</span>` : ''}</div>`;
  const lease = S.leases.find(l => l.appId === a.id);
  const canEditDocs = (a.stage === 'admin_review' && adm) || a.stage === 'agent_review';
  let action = '';
  if (a.stage === 'client') {
    action = a.mode === 'external'
      ? `<form class="stack" data-form="external" data-id="${a.id}"><p>${t('Cette demande passe par un outil de sélection externe. Inscrivez la référence et le résultat.', 'This application runs through an outside screening tool. Record the reference and the result.')}</p><div class="fgrid">${fld(t('Référence dans l’outil externe', 'Reference in the outside tool'), inp('ext', 'ref', 'text', (a.external || {}).ref, 'required'))}${fld(t('Résultat', 'Result'), sel('ext', 'result', [['pending', t('En attente', 'Pending')], ['approved', t('Approuvé', 'Approved')], ['refused', t('Refusé', 'Refused')]].map(o => opt(o[0], o[1], (a.external || {}).result)).join('')))}</div><div><button class="btn primary" type="submit">${t('Enregistrer le résultat', 'Save the result')}</button></div></form>`
      : `<p>${t('Le candidat remplit et signe le formulaire à partir de son lien personnel, valide 30 jours.', 'The applicant fills in and signs the form from a personal link, valid for 30 days.')}</p><div class="row">${btn('modal', t('Ouvrir la vue du candidat', 'Open the applicant’s view'), 'primary', `data-m="renter" data-id="${a.id}"`)}${btn('nudge', t('Relancer le candidat', 'Nudge the applicant'), '', `data-id="${a.id}"`)}</div>`;
  } else if (a.stage === 'agent_review') {
    const consent = a.form && a.form.consent, ds = k => (a.docs.find(d => d.key === k) || {}).status;
    action = `<form class="stack" data-form="agentCheck" data-id="${a.id}"><p>${t('Vérifiez le dossier avant de l’envoyer à la sélection.', 'Check the file before sending it to screening.')}</p>
      <label class="check"><input id="f-chk-idSeen" name="idSeen" type="checkbox" ${ds('id_seen') === 'verified' ? 'checked' : ''}><span>${t('J’ai vu une pièce d’identité. Aucune copie n’est conservée.', 'I have seen a piece of ID. No copy is kept.')}</span></label>
      <div class="fgrid">${fld(t('Résultat de l’enquête de crédit (simulation)', 'Credit check result (simulated)'), sel('chk', 'band', opt('', consent ? t('Pas encore lancée', 'Not run yet') : t('Aucun consentement', 'No consent'), (a.credit || {}).band) + (consent ? BANDS.map(x => opt(x, x, (a.credit || {}).band)).join('') : ''), consent ? '' : 'disabled'))}${fld(t('Référence du locateur précédent', 'Previous landlord reference'), sel('chk', 'reference', [['none', t('Pas encore jointe', 'Not reached yet')], ['positive', t('Positive', 'Positive')], ['negative', t('Négative', 'Negative')]].map(o => opt(o[0], o[1], a.reference)).join('')))}</div>
      <label class="check"><input id="f-chk-income" name="income" type="checkbox" ${ds('income_optional') === 'verified' ? 'checked' : ''}><span>${t('Le candidat a fourni une preuve de revenu de son plein gré (facultatif).', 'The applicant chose to provide proof of income (optional).')}</span></label>
      <div><button class="btn primary" type="submit">${t('Envoyer à la sélection', 'Send to screening')}</button></div></form>`;
  } else if (a.stage === 'admin_review') {
    const rule = a.rule ? (a.rule.pass ? `<p>${tag('good', t('Dossier clair selon les règles', 'Clear pass under the rules'))}</p>` : `<div class="note warn"><b>${t('Les règles n’ont pas laissé passer ce dossier :', 'The rules did not pass this file:')}</b><ul style="margin:4px 0 0;padding-left:18px">${a.rule.reasons.map(r => `<li>${esc(L(r))}</li>`).join('')}</ul></div>`) : `<p class="muted">${t('Mode administrateur : aucune règle appliquée.', 'Admin mode: no rules applied.')}</p>`;
    action = rule + (adm ? `<form class="stack" data-form="decide" data-id="${a.id}">${fld(t('Motif (obligatoire pour un refus)', 'Reason (required for a refusal)'), inp('dec', 'reason', 'text', ''))}<div class="row"><button class="btn primary" type="submit" name="result" value="approved">${isBroker() ? t('Approuver et envoyer au propriétaire', 'Approve and send to the landlord') : t('Approuver la demande', 'Approve the application')}</button><button class="btn danger" type="submit" name="result" value="refused">${t('Refuser la demande', 'Refuse the application')}</button></div></form>` : `<p class="muted">${t('En attente de la décision de l’administrateur.', 'Waiting for the admin’s decision.')}</p>`);
  } else if (a.stage === 'partner') {
    action = `<p>${t('Dossier envoyé à ', 'File sent to ')}<b>${esc(p ? p.name : t('au propriétaire', 'the landlord'))}</b>. ${p && L(p.criteria) ? esc(L(p.criteria)) : ''}</p>` + (adm ? `<form class="stack" data-form="partnerDecision" data-id="${a.id}">${fld(t('Motif du propriétaire (pour un refus)', 'Landlord’s reason (for a refusal)'), inp('pd', 'reason', 'text', ''))}<div class="row"><button class="btn primary" type="submit" name="result" value="approved">${t('Le propriétaire accepte', 'Landlord accepts')}</button><button class="btn danger" type="submit" name="result" value="refused">${t('Le propriétaire refuse', 'Landlord refuses')}</button></div></form>` : `<p class="muted">${t('En attente de la réponse du propriétaire.', 'Waiting for the landlord’s answer.')}</p>`);
  } else if (a.stage === 'approved') {
    const canFill = lease && lease.status === 'draft' && !lease.start && (adm || set().lease === 'agent');
    action = `<p>${tag('good', t('Demande approuvée', 'Application approved'))} ${a.decision ? `<span class="small muted">${a.decision.by === 'rules' ? t('par les règles', 'by the rules') : t('par une personne', 'by a person')} · ${esc(a.decision.at)}</span>` : ''}</p>`
      + (lease ? `<div class="spread"><span>${t('Bail : ', 'Lease: ')}${tag(leaseKind(lease.status), leaseLabel(lease))}</span><span class="row">${canFill ? btn('modal', t('Remplir le bail', 'Fill in the lease'), 'primary', `data-m="lease" data-id="${lease.id}"`) : ''}${adm ? btn('go', t('Ouvrir les baux', 'Open leases'), '', 'data-view="baux"') : ''}</span></div>` : '');
  } else if (a.stage === 'refused') {
    action = `<p>${tag('bad', t('Demande refusée', 'Application refused'))} ${a.decision ? `<span class="small muted">${a.decision.by === 'rules' ? t('par les règles seules', 'by the rules alone') : t('par une personne', 'by a person')} · ${esc(a.decision.at)}</span>` : ''}</p>${a.decision && a.decision.reason ? `<p>${t('Motif : ', 'Reason: ')}${esc(L(a.decision.reason))}</p>` : ''}`
      + (a.autoNotice ? `<div class="note warn">${t('Décision prise par les règles seules. Le candidat doit en être informé au moment de la décision et peut demander qu’une personne la révise.', 'Decision made by the rules alone. The applicant must be told so when notified, and can ask for a person to review it.')}</div><div>${btn('humanReview', t('Envoyer en révision par une personne', 'Send for review by a person'), '', `data-id="${a.id}"`)}</div>` : '');
  }
  const f = a.form;
  const answers = f ? `<div class="panel"><div class="ptitle"><h3>${t('Réponses du candidat', 'Applicant’s answers')}</h3>${tag('good', t('Signé électroniquement', 'Signed electronically'))}</div><dl class="kv" style="margin:0"><div><dt>${t('Nom complet', 'Full name')}</dt><dd style="margin:0">${esc(f.name)}</dd></div><div><dt>${t('Adresse actuelle', 'Current address')}</dt><dd style="margin:0">${esc(f.address)}</dd></div><div><dt>${t('Locateur précédent', 'Previous landlord')}</dt><dd style="margin:0">${esc(f.prevLandlord)} · ${esc(f.prevPhone)}</dd></div><div><dt>${t('Enquête de crédit', 'Credit check')}</dt><dd style="margin:0">${f.consent ? t('Consentement donné', 'Consent given') : t('Consentement refusé', 'Consent declined')}</dd></div>${f.employer || f.income ? `<div><dt>${t('Emploi et revenu (fournis volontairement)', 'Job and income (provided voluntarily)')}</dt><dd style="margin:0">${esc([f.employer, f.income].filter(Boolean).join(' · '))}</dd></div>` : ''}</dl></div>`
    : a.external ? `<div class="panel"><h3>${t('Outil externe', 'Outside tool')}</h3><p>${t('Référence : ', 'Reference: ')}<b>${esc(a.external.ref)}</b></p></div>` : '';
  const docs = `<div class="panel"><div class="ptitle"><h3>${t('Documents', 'Documents')}</h3><span class="small muted num">${docsDone(a)} ${t('obligatoires vérifiés', 'required verified')}</span></div>${a.docs.map(d => { const st = docStatus(d.status); return `<div class="spread"><span class="small">${esc(docLabel(d.key))}${d.required ? '' : ` <span class="muted">(${t('facultatif', 'optional')})</span>`}</span><span class="row">${tag(st[1], st[0])}${canEditDocs ? btn('doc', t('Vérifier', 'Verify'), 'sm', `data-id="${a.id}" data-k="${d.key}" data-s="verified"`) + btn('doc', t('Signaler', 'Flag'), 'sm', `data-id="${a.id}" data-k="${d.key}" data-s="flagged"`) : ''}</span></div>`; }).join('')}
    <p class="small muted">${t('Liste par défaut conforme aux balises québécoises : tout le reste est facultatif et fourni volontairement.', 'Default list follows Quebec guidance: anything more is optional and provided voluntarily.')}</p></div>`;
  return `<div>${btn('back', t('Retour aux demandes', 'Back to applications'), 'sm')}</div>
    ${head(t('Demande de ', 'Application from ') + cname(c), `${esc(unitLabel(u))} · <span class="num">${money(u.rent)}</span>${t(' par mois', ' per month')}`, tag(appKind(a.stage), appLabel(a.stage)))}
    ${stepper}
    <div class="cols wide"><div class="stack"><div class="panel"><h3>${t('Prochaine action', 'Next action')}</h3>${action}</div>${answers}${docs}</div>
    <div class="stack"><div class="panel"><h3>${t('Résumé', 'Summary')}</h3><dl class="kv" style="margin:0;grid-template-columns:1fr 1fr"><div><dt>${t('Agent', 'Agent')}</dt><dd style="margin:0">${esc(U(a.agentId).name)}</dd></div><div><dt>${t('Saisie', 'Intake')}</dt><dd style="margin:0">${a.mode === 'external' ? t('Outil externe', 'Outside tool') : t('Formulaire Orhaus', 'Orhaus form')}</dd></div>${p ? `<div><dt>${t('Propriétaire', 'Landlord')}</dt><dd style="margin:0">${esc(p.name)}</dd></div>` : ''}<div><dt>${t('Règles', 'Rules')}</dt><dd style="margin:0">${ruleTag(a)}</dd></div></dl>${c ? `<div>${btn('openClient', t('Ouvrir le dossier du client', 'Open the client file'), 'sm', `data-id="${c.id}"`)}</div>` : ''}</div>
      ${reviewPanel(a)}<div class="panel"><h3>${t('Historique', 'History')}</h3><ul class="log">${a.history.map(h => `<li>${esc(L(h.txt))}<div class="small muted">${esc(h.at)}</div></li>`).join('')}</ul></div></div></div>`;
}

/* ---------- commissions ---------- */
VIEWS.commissions = () => {
  const adm = isAdmin(), list = mine(S.coms);
  const sum = s => list.filter(k => k.status === s).reduce((n, k) => n + k.amount, 0);
  const tiles = `<div class="cols">${[['pending', t('À approuver', 'To approve')], ['approved', t('Approuvées, à payer', 'Approved, to pay')], ['paid', t('Payées', 'Paid')]].map(x => `<div class="panel"><span class="small muted" style="font-weight:600">${x[1]}</span><span class="big num">${money(sum(x[0]))}</span></div>`).join('')}</div>`;
  const rows = list.map(k => {
    const l = byId(S.leases, k.leaseId) || {}, c = C(l.clientId), u = UN(l.unitId);
    let acts = '';
    if (adm) {
      if (k.status === 'pending') acts = btn('com', t('Approuver', 'Approve'), 'sm primary', `data-id="${k.id}" data-s="approved"`);
      else if (k.status === 'approved') acts = btn('com', t('Marquer payée', 'Mark paid'), 'sm primary', `data-id="${k.id}" data-s="paid" ${isBroker() && !k.partnerPaid ? 'disabled' : ''}`);
    }
    return `<tr><td>${esc(fdate(k.createdAt))}</td>${adm ? `<td>${esc(U(k.agentId).name)}</td>` : ''}<td>${esc(cname(c))}</td><td>${u ? esc(unitLabel(u)) : '—'}</td><td class="num r"><b>${money(k.amount)}</b></td>${isBroker() ? `<td>${adm ? `<label class="check"><input id="pp-${k.id}" type="checkbox" data-chg="partnerPaid" data-id="${k.id}" ${k.partnerPaid ? 'checked' : ''}><span class="small">${t('Reçu', 'Received')}</span></label>` : (k.partnerPaid ? tag('good', t('Reçu', 'Received')) : tag('', t('En attente', 'Waiting')))}</td>` : ''}<td>${tag(comKind(k.status), comLabel(k.status))}</td><td class="r">${acts}</td></tr>`;
  }).join('');
  const c = set().com;
  return head(adm ? t('Commissions', 'Commissions') : t('Mes commissions', 'My commission'),
    t('Une ligne est créée automatiquement dès qu’un bail est marqué signé. Règle de l’agence : ', 'A line is created automatically as soon as a lease is marked signed. Agency rule: ') + (c.basis === 'flat' ? money(c.flat) + t(' par bail', ' per lease') : c.rate + t('\u00a0% du premier mois de loyer', '% of the first month’s rent')) + '.')
    + tiles + (rows ? `<div class="tw"><table><thead><tr><th>${t('Bail signé', 'Lease signed')}</th>${adm ? `<th>${t('Agent', 'Agent')}</th>` : ''}<th>${t('Client', 'Client')}</th><th>${t('Unité', 'Unit')}</th><th class="r">${t('Montant', 'Amount')}</th>${isBroker() ? `<th>${t('Paiement du propriétaire', 'Landlord’s payment')}</th>` : ''}<th>${t('Statut', 'Status')}</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : empty(t('Aucune commission pour l’instant. Elle apparaît dès la signature d’un bail.', 'No commission yet. It appears as soon as a lease is signed.')))
    + (isBroker() ? `<p class="note">${t('Mode courtier : le paiement à l’agent se débloque quand le paiement du propriétaire est reçu.', 'Brokerage mode: the agent’s payout unlocks once the landlord’s payment is received.')}</p>` : '');
};

/* ---------- tenant reviews ---------- */
function reviewPanel(a) {
  const r = reviewOf(a.id); if (!r) return '';
  const body = r.status === 'received'
    ? `<p><b class="num">${r.rating} / 5</b>${r.text ? ' · ' + esc(L(r.text)) : ''}</p><p class="small muted">${t('Rabais accordé : ', 'Discount granted: ')}<span class="num">${money(r.credit)}</span>${t(' sur le premier mois de loyer.', ' off the first month’s rent.')}</p>`
    : `<p class="small">${t('Invitation envoyée après l’approbation. Le rabais de ', 'Invitation sent after approval. The discount of ')}<span class="num">${money(r.amount)}</span>${t(' est le même, quelle que soit la note.', ' is the same whatever the rating.')}</p><div>${btn('modal', t('Ouvrir la vue du locataire', 'Open the renter’s view'), 'sm primary', `data-m="review" data-id="${r.id}"`)}</div>`;
  return `<div class="panel"><div class="ptitle"><h3>${t('Avis du locataire', 'Renter’s review')}</h3>${tag(reviewKind(r.status), reviewLabel(r.status))}</div>${body}</div>`;
}
VIEWS.avis = () => {
  const adm = isAdmin(), rs = reviewSet(), list = mine(S.reviews), got = list.filter(r => r.status === 'received');
  const avg = got.length ? (got.reduce((n, r) => n + r.rating, 0) / got.length).toLocaleString(loc(), { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' / 5' : '—';
  const tiles = `<div class="cols" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">${[[t('Avis reçus', 'Reviews received'), got.length], [t('Note moyenne', 'Average rating'), avg], [t('Invitations en attente', 'Invitations waiting'), list.length - got.length], [t('Rabais accordés', 'Discounts granted'), money(got.reduce((n, r) => n + (r.credit || 0), 0))]].map(x => `<div class="panel"><span class="small muted" style="font-weight:600">${x[0]}</span><span class="big num">${x[1]}</span></div>`).join('')}</div>`;
  const rows = list.map(r => {
    const c = C(r.clientId), u = UN(r.unitId), done = r.status === 'received';
    const text = done ? esc(L(r.text)) + `<div class="small muted">${r.publish ? t('Publication autorisée, avec la mention « Avis recueilli contre un rabais »', 'Publication allowed, labelled “Review collected in exchange for a discount”') : t('Publication non autorisée par le locataire', 'Publication not allowed by the renter')}</div>` : `<span class="muted">${t('En attente du locataire', 'Waiting for the renter')}</span>`;
    return `<tr><td class="nw">${esc(fdate((r.at || r.invitedAt).slice(0, 10)))}</td><td><b>${esc(cname(c))}</b></td><td>${u ? esc(unitLabel(u)) : '—'}</td>${adm ? `<td>${esc(U(r.agentId).name)}</td>` : ''}<td class="num nw">${done ? `<b>${r.rating} / 5</b>` : '—'}</td><td style="max-width:42ch">${text}</td><td class="num r">${money(done ? r.credit : r.amount)}</td><td>${tag(reviewKind(r.status), reviewLabel(r.status))}</td><td class="r">${done ? '' : btn('modal', t('Vue du locataire', 'Renter’s view'), 'sm primary', `data-m="review" data-id="${r.id}"`)}</td></tr>`;
  }).join('');
  const off = rs.on ? '' : `<div class="note warn">${t('Les avis sont désactivés pour cette agence. Aucune nouvelle invitation n’est envoyée.', 'Reviews are switched off for this agency. No new invitation is sent.')}${adm ? ' ' + btn('go', t('Ouvrir les réglages', 'Open settings'), 'link', 'data-view="reglages"') : ''}</div>`;
  return head(adm ? t('Avis des locataires', 'Tenant reviews') : t('Mes avis', 'My reviews'), t('Après l’approbation de sa demande, le futur locataire est invité à donner un avis honnête. Il reçoit un rabais sur son premier mois de loyer, le même quelle que soit sa note.', 'Once the application is approved, the future tenant is invited to give an honest review. They get a discount on the first month’s rent, the same whatever rating they give.'))
    + off + tiles
    + (rows ? `<div class="tw"><table><thead><tr><th>${t('Date', 'Date')}</th><th>${t('Locataire', 'Renter')}</th><th>${t('Unité', 'Unit')}</th>${adm ? `<th>${t('Agent', 'Agent')}</th>` : ''}<th>${t('Note', 'Rating')}</th><th>${t('Avis', 'Review')}</th><th class="r">${t('Rabais', 'Discount')}</th><th>${t('Statut', 'Status')}</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : empty(t('Aucun avis pour l’instant. Une invitation part dès qu’une demande est approuvée.', 'No reviews yet. An invitation goes out as soon as an application is approved.')))
    + `<div class="panel"><h3>${t('Les règles de cette fonction', 'The rules of this feature')}</h3><ul class="small" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;max-width:80ch"><li>${t('Le rabais est le même pour un avis positif ou négatif. Personne ne demande une note au locataire.', 'The discount is the same for a positive or a negative review. Nobody asks the renter for a rating.')}</li><li>${t('L’invitation part après la décision sur la demande, jamais avant.', 'The invitation goes out after the decision on the application, never before.')}</li><li>${t('Un avis publié porte toujours la mention « Avis recueilli contre un rabais ».', 'A published review always carries the label “Review collected in exchange for a discount”.')}</li><li>${t('Ces avis restent dans Orhaus et sur le site de l’agence. Ils ne sont pas envoyés vers Google, qui interdit les avis donnés contre un avantage.', 'These reviews stay in Orhaus and on the agency’s own site. They are not sent to Google, which bans reviews given in exchange for an incentive.')}</li><li>${t('Il n’y a pas de dépôt au Québec : le rabais s’applique au premier mois de loyer.', 'There is no deposit in Quebec: the discount applies to the first month’s rent.')}</li></ul></div>`;
};

/* ---------- guides ---------- */
VIEWS.guides = () => {
  const g = [
    [t('Publier une annonce', 'Post a listing'), t('Ouvrez Mes annonces, copiez la description, publiez-la sur le site d’annonces avec les photos de l’immeuble, puis marquez le créneau comme publié. Votre code d’annonce relie chaque réponse à votre dossier.', 'Open My listings, copy the description, post it on the listing site with the building photos, then mark the slot as posted. Your listing code ties each reply to your file.')],
    [t('Réserver et confirmer une visite', 'Book and confirm a showing'), t('Réservez la visite depuis le dossier du client ou la page de l’immeuble. Le prospect reçoit un courriel et doit confirmer ou refuser. Après la visite, inscrivez le résultat le jour même.', 'Book the showing from the client file or the building page. The prospect gets an email and must confirm or decline. After the showing, log the outcome the same day.')],
    [t('Ce qu’on peut demander à un candidat au Québec', 'What you may ask an applicant in Quebec'), t('Le formulaire par défaut demande le nom, l’adresse actuelle, les coordonnées du locateur précédent et le consentement à une enquête de crédit. La pièce d’identité est vue, jamais copiée. Emploi, salaire et autres documents restent facultatifs. Faites valider votre formulaire par un juriste.', 'The default form asks for the name, the current address, the previous landlord’s contact and consent to a credit check. ID is seen, never copied. Job, salary and other documents stay optional. Have a lawyer review your form.')],
    [t('Aucun dépôt', 'No deposits'), t('Seul le premier mois de loyer peut être exigé à la signature. Orhaus ne permet de percevoir ni dépôt ni frais de demande.', 'Only the first month’s rent can be required at signing. Orhaus collects neither deposits nor application fees.')],
    [t('Avis des locataires', 'Tenant reviews'), t('L’invitation part toute seule après l’approbation de la demande. Ne demandez jamais une bonne note et ne remplissez jamais l’avis à la place du locataire. Le rabais sur le premier mois est le même pour un avis positif ou négatif.', 'The invitation goes out by itself once the application is approved. Never ask for a good rating and never fill in the review for the renter. The discount on the first month is the same for a positive or a negative review.')]
  ];
  return head(t('Guides', 'Guides'), t('Exemples de départ. Chaque agence écrit ses propres procédures ici.', 'Starter examples. Each agency writes its own procedures here.'))
    + `<div class="stack">${g.map((x, i) => `<details class="panel" ${i === 0 ? 'open' : ''}><summary style="cursor:pointer;font-family:var(--font-display);font-weight:600;font-size:1.35rem">${esc(x[0])}</summary><p style="max-width:65ch">${esc(x[1])}</p></details>`).join('')}</div>`;
};
/* ---------- lead pipeline and assigned leads ---------- */
const activeLead = c => c.stage !== 'signed' && c.stage !== 'lost';
const expected = list => list.filter(activeLead).reduce((n, c) => n + prob(c), 0) / 100;
const fnum = n => new Intl.NumberFormat(loc(), { minimumFractionDigits: 1, maximumFractionDigits: 1 }).format(n);
const agentCell = c => c.agentId ? esc(U(c.agentId).name) : tag('warn', t('À attribuer', 'To assign'));
const stat = (n, label, sub) => `<div class="stat"><b class="num">${n}</b><span>${esc(label)}</span>${sub ? `<span class="small muted">${esc(sub)}</span>` : ''}</div>`;
const budget = c => `${money(c.brief.budgetMin)} – ${money(c.brief.budgetMax)}`;

/* The board: one column per stage, each with its closing probability. Leads move by drag and drop or with the button on the card. */
VIEWS.pipeline = () => {
  const adm = isAdmin(), ag = UI.f.pagent || '';
  const list = mine(S.clients).filter(c => !adm || !ag || (ag === 'none' ? !c.agentId : c.agentId === ag));
  const lost = list.filter(c => c.stage === 'lost');
  const sum = `<div class="pipe-sum">${stat(list.filter(activeLead).length, t('Prospects en cours', 'Open leads'))}${stat(fnum(expected(list)), t('Baux attendus', 'Expected leases'), t('Somme des probabilités des prospects en cours', 'Sum of the probabilities of open leads'))}${stat(list.filter(c => c.stage === 'signed').length, t('Baux signés', 'Leases signed'))}${stat(lost.length, t('Perdus', 'Lost'))}</div>`;
  const cols = STAGES.map((s, i) => {
    const col = list.filter(c => c.stage === s).sort((a, b) => score(b) - score(a)), nx = STAGES[i + 1];
    const cards = col.map(c => `<div class="pcard" draggable="true" data-lead="${c.id}">
        <button type="button" class="btn link" data-act="openClient" data-id="${c.id}">${esc(cname(c))}</button>
        <span class="small muted num nw">${budget(c)}</span>${c.brief.size || c.brief.area ? `<span class="small muted">${esc([c.brief.size, c.brief.area].filter(Boolean).join(' · '))}</span>` : ''}
        ${adm ? `<span class="small">${agentCell(c)}</span>` : (assignedByOffice(c) ? `<span class="small muted">${t('Attribué par l’agence', 'Assigned by the office')}</span>` : '')}

    + `<div class="panel"><div class="ptitle"><h3>${t('Prospects attribués par l’agence', 'Leads assigned by the office')}</h3><span class="small muted num">${given.length}</span></div>${givenRows ? `<div class="tw"><table><thead><tr><th>${t('Prospect', 'Lead')}</th><th>${t('Étape et probabilité', 'Stage and probability')}</th><th>${t('Attribué par', 'Assigned by')}</th><th class="r">${t('Agent', 'Agent')}</th></tr></thead><tbody>${givenRows}</tbody></table></div>` : empty(t('Aucun prospect attribué pour le moment.', 'No assigned leads yet.'))}
      <p class="small muted">${t('Un prospect qui a une visite à venir ou une demande en cours ne peut pas être retiré : réattribuez-le. La réattribution déplace ses visites à venir et sa demande en cours vers le nouvel agent ; les visites faites, les baux signés et les commissions restent à l’agent qui a fait le travail.', 'A lead with an upcoming showing or an open application can’t be unassigned: reassign it. Reassigning moves its upcoming showings and open application to the new agent; past showings, signed leases and commissions stay with the agent who did the work.')}</p></div>`;

/* ---------- admin: schedule builder ---------- */
VIEWS.horaire = () => {
  const d = today(), wk = UI.week || monday(d), end = addDays(wk, 6), st = set();
  const list = S.slots.filter(s => s.date >= wk && s.date <= end).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.win < b.win ? -1 : 1));
  const prop = list.filter(s => s.status === 'proposed').length;
  const live = list.filter(s => s.status === 'to_post' || s.status === 'posted'), posted = live.filter(s => s.status === 'posted').length;
  const free = S.units.filter(u => u.status === 'available');
  const wins = ['10 h – 12 h', '13 h – 15 h', '16 h – 18 h'];
  const def = d >= wk && d <= end ? d : wk;
  const modeNote = { admin: t('Réglage actuel : l’administrateur construit l’horaire à la main.', 'Current setting: the admin builds the schedule by hand.'), rule: t('Réglage actuel : la règle de répartition construit l’horaire, sans approbation.', 'Current setting: the dispatch rule builds the schedule, with no approval step.'), rule_approve: t('Réglage actuel : la règle propose, l’administrateur approuve.', 'Current setting: the rule proposes and the admin approves.') }[st.assign];
  const rows = list.map(s => {
    const u = UN(s.unitId), late = s.status === 'to_post' && s.date < d;
    let acts = '';
    if (s.status === 'proposed') acts += btn('slot', t('Approuver', 'Approve'), 'sm primary', `data-id="${s.id}" data-s="approve"`);
    if (s.status === 'to_post') acts += btn('slot', t('Mettre en pause', 'Pause'), 'sm', `data-id="${s.id}" data-s="pause"`);
    if (s.status === 'paused') acts += btn('slot', t('Reprendre', 'Resume'), 'sm', `data-id="${s.id}" data-s="resume"`);
    if (s.status !== 'posted') acts += btn('slot', t('Retirer', 'Remove'), 'sm danger', `data-id="${s.id}" data-s="remove"`);
    return `<tr><td class="num"><b>${esc(fdate(s.date))}</b><div class="small muted">${esc(s.win)}</div></td><td>${u ? `<b>${esc(unitLabel(u))}</b><div class="small muted num">${esc(u.size)} · ${money(u.rent)}</div>` : '—'}</td>
      <td><select id="sa-${s.id}" data-chg="slotAgent" data-id="${s.id}" aria-label="${t('Agent', 'Agent')}" ${s.status === 'posted' ? 'disabled' : ''}>${S.users.filter(x => x.role === 'agent' && (x.active || x.id === s.agentId)).map(a => opt(a.id, a.name, s.agentId)).join('')}</select></td>
      <td>${late ? tag('bad', t('En retard', 'Overdue')) : tag(slotKind(s.status), slotLabel(s.status))} ${s.by === 'rule' ? `<span class="small muted">${t('par la règle', 'by the rule')}</span>` : ''}</td><td class="r"><span class="row" style="justify-content:flex-end">${acts}</span></td></tr>`;
  }).join('');
  return head(t('Horaire des annonces', 'Listing schedule'), `${t('Semaine du ', 'Week of ')}${esc(fdate(wk, { day: 'numeric', month: 'long' }))}. ${posted} ${t('sur', 'of')} ${live.length} ${t('annonces publiées', 'listings posted')}.`,
    btn('week', t('Semaine précédente', 'Previous week'), '', 'data-d="-7"') + btn('week', t('Semaine suivante', 'Next week'), '', 'data-d="7"')
    + (st.assign !== 'admin' ? btn('dispatch', t('Proposer la semaine avec la règle', 'Propose the week with the rule'), 'dark') : '')
    + (prop ? btn('approveAll', t('Approuver les ', 'Approve the ') + prop + t(' propositions', ' proposals'), 'primary') : ''))
    + `<p class="note">${modeNote} ${t('La règle fait tourner les agents à parts égales et commence par les unités libres depuis le plus longtemps.', 'The rule rotates agents evenly and starts with the units that have been vacant longest.')}</p>`
    + `<form class="panel" data-form="slot"><h3>${t('Ajouter un créneau', 'Add a slot')}</h3><div class="fgrid">${fld(t('Unité à annoncer', 'Unit to list'), sel('slot', 'unitId', free.map(u => opt(u.id, unitLabel(u) + ' · ' + u.size + ' · ' + money(u.rent))).join(''), 'required'))}${fld(t('Agent', 'Agent'), sel('slot', 'agentId', agents().map(a => opt(a.id, a.name)).join(''), 'required'))}${fld(t('Jour', 'Day'), inp('slot', 'date', 'date', def, `min="${wk}" max="${end}" required`))}${fld(t('Créneau de 2 heures', '2-hour window'), sel('slot', 'win', wins.map(w => opt(w, w)).join('')))}</div><div><button class="btn primary" type="submit">${t('Ajouter le créneau', 'Add the slot')}</button></div></form>`
    + (rows ? `<div class="tw"><table><thead><tr><th>${t('Jour', 'Day')}</th><th>${t('Unité', 'Unit')}</th><th>${t('Agent', 'Agent')}</th><th>${t('Statut', 'Status')}</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : empty(t('Aucun créneau cette semaine. Ajoutez-en un ou lancez la règle.', 'No slots this week. Add one or run the rule.')));
};

    + `<p class="note">${t('Au Québec, le bail se signe sur le formulaire obligatoire du Tribunal administratif du logement. Orhaus prépare les données et conserve le bail signé, il ne remplace pas ce formulaire.', 'In Quebec, the lease is signed on the mandatory form of the Tribunal administratif du logement. Orhaus prepares the data and keeps the signed lease. It does not replace that form.')}</p>`;
