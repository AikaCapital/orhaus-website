# getorhaus.com : site statique, aucune étape de build. Netlify publie le dossier public/.
[build]
  publish = "public"

# En-têtes de sécurité de base pour toutes les pages.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
